# CIDINT OS development image for x86_64 UEFI machines and QEMU.
#
#   pip install kas==4.8.2
#   kas build kas/cidint-x86-64-dev.yml
#
# Root is locked in every image (no default password). Disk images ask
# for a root password on their first start; the installer requires one;
# live media log in automatically on the local console only.
#
# Update signing: set CIDINT_UPDATE_PUBKEY to the base64 line of an Ed25519
# public key (PEM) to make the images trust updates signed with its
# private key. CI creates a throwaway development key per run. Release
# builds must use the separate, offline production key. Without a key the
# images refuse every update.
header:
  version: 14

machine: genericx86-64
distro: cidint
target:
  - cidint-image-base
  - cidint-image-live
  - cidint-image-server
  - cidint-image-desktop
  - cidint-image-desktop-live

env:
  CIDINT_UPDATE_PUBKEY: ""

repos:
  # This repository (the directory containing kas/).
  cidint:
    layers:
      meta-cidint:

  # Yocto Project 5.0 LTS "scarthgap", pinned to an exact commit.
  # Resolved from refs/heads/scarthgap on 2026-11-14. Update deliberately,
  # and record the change in docs/RELEASE notes.
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    commit: 6b7c1066f778db5a6b3e35400617b10342988fa8
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  # OpenEmbedded layers for cryptsetup (meta-oe) and nftables
  # (meta-networking; meta-python is a declared dependency of that layer).
  # Resolved from refs/heads/scarthgap on 2026-11-15.
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    commit: 2db6aece32c7f8ebf6015b468e1b4e21de072e3b
    layers:
      meta-oe:
      meta-python:
      meta-networking:

local_conf_header:
  cidint-dev: |
    # Keep disk usage within a hosted CI runner.
    INHERIT += "rm_work"
    # Live ISO initramfs: boot scripts only, without the Yocto reference
    # installer (it formats disks and knows nothing of the CIDINT layout).
    INITRAMFS_SCRIPTS = "initramfs-framework-base initramfs-module-setup-live initramfs-module-udev"
    BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
    PARALLEL_MAKE ?= "-j ${@oe.utils.cpu_count()}"
