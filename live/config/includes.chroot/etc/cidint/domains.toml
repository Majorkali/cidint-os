# CIDINT OS security domains.
# Each domain is an isolated compartment with its own private home directory
# (~/.local/share/cidint/domains/<name>/home) and its own network policy:
#   none    no network at all
#   direct  normal networking
#   tor     forced through Tor
# Run something in a domain:   cidint domain run work -- firefox-esr --no-remote
# Throwaway compartment:       cidint domain disposable -- firefox-esr --no-remote

[domain.personal]
label = "Personal"
color = "#3ddc97"
network = "direct"

[domain.work]
label = "Work and development"
color = "#4aa8ff"
network = "direct"

[domain.banking]
label = "Banking (nothing else runs here)"
color = "#ffc857"
network = "direct"

[domain.research]
label = "Anonymous research"
color = "#35e0c8"
network = "tor"

[domain.untrusted]
label = "Untrusted files and links"
color = "#ff5c7a"
network = "tor"

[domain.vault]
label = "Vault: keys and secrets, offline"
color = "#b48cff"
network = "none"
