#!/usr/sbin/nft -f
# CIDINT OS base firewall: nothing unsolicited comes in, nothing is forwarded
# except for local virtual machines. Anonymous Mode and the kill switch add
# their own tables on top (see /etc/cidint/nft-anon.nft, `cidint lockdown`).

flush ruleset

table inet cidint_base {
  chain input {
    type filter hook input priority filter; policy drop;
    iifname "lo" accept
    ct state established,related accept
    ct state invalid drop
    icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
    icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem,
                  nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept
    iifname "virbr*" udp dport { 53, 67 } accept
    iifname "virbr*" tcp dport 53 accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state established,related accept
    iifname "virbr*" accept
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
