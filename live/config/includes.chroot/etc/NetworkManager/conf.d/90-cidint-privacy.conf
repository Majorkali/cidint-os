# CIDINT OS: do not let networks track this machine.
# A new random MAC address is used for scanning and for every connection,
# the hostname is never sent to DHCP servers, and IPv6 uses temporary addresses.

[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
connection.stable-id=${CONNECTION}/${BOOT}
ipv6.ip6-privacy=2
ipv4.dhcp-send-hostname=0
ipv6.dhcp-send-hostname=0

[connectivity]
# no periodic "am I online" request to a third-party server
enabled=false
