<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CIDINT OS</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: linear-gradient(160deg, #0b1f33 0%, #0a1626 55%, #06303a 100%);
         color: #e6eef7; font-family: "Liberation Sans", sans-serif; }
  main { text-align: center; max-width: 640px; padding: 24px; }
  h1 { font-size: 40px; letter-spacing: 3px; margin: 0 0 6px; }
  p.tag { color: #8fb4cc; margin: 0 0 36px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; font-size: 17px; padding: 12px 14px; border-radius: 10px; border: 1px solid #24476a;
          background: #0f2238; color: #e6eef7; }
  input:focus { outline: none; border-color: #2bd4e0; }
  button { font-size: 16px; padding: 0 18px; border-radius: 10px; border: 1px solid #2bd4e0;
           background: #13a3b0; color: #021018; font-weight: bold; }
  p.note { color: #8fa3b8; font-size: 13px; margin-top: 28px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>CIDINT OS</h1>
  <p class="tag">Intelligence Beyond Limits.</p>
  <form action="https://duckduckgo.com/html/" method="get">
    <input name="q" placeholder="Search the web" autofocus>
    <button type="submit">Search</button>
  </form>
  <p class="note">Searches go to DuckDuckGo, a third-party service. Use a Private tab to keep no history,
  cookies or cache on this computer.</p>
</main>
</body>
</html>
