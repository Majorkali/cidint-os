# CIDINT OS distribution policy.
#
# Starts from the Poky reference policy (toolchain defaults, QA checks,
# SPDX generation) and sets CIDINT's own choices on top. The kernel is
# the upstream Linux LTS kernel packaged by the Yocto Project; CIDINT
# does not own it.
require conf/distro/poky.conf

DISTRO = "cidint"
DISTRO_NAME = "CIDINT OS"
DISTRO_VERSION = "1.0.0"
DISTRO_CODENAME = "foundation"
SDK_VENDOR = "-cidintsdk"
MAINTAINER = "CIDINT OS Project"
TARGET_VENDOR = "-cidint"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " usrmerge"
# Not needed on the base image; smaller attack surface.
DISTRO_FEATURES:remove = "nfs zeroconf 3g nfc x11"
# Graphical session: Wayland only, no X11.
DISTRO_FEATURES:append = " wayland opengl"
# Weston asks for PAM only because its stock start-up package (weston-init)
# logs a user in through PAM. CIDINT starts the compositor from its own
# service through seatd, so PAM is not needed.
REQUIRED_DISTRO_FEATURES:pn-weston = "wayland opengl"
# Do not pull in weston-init at all (it cannot be built without PAM).
RRECOMMENDS:weston:remove:pn-weston = "weston-init"

# Encrypted data volume: systemd unlocks LUKS volumes listed in /etc/crypttab.
PACKAGECONFIG:append:pn-systemd = " cryptsetup"
# Smaller cryptsetup and nftables: no SSH token plugin, no Python bindings.
PACKAGECONFIG:remove:pn-cryptsetup = "ssh-token"
PACKAGECONFIG:remove:pn-nftables = "python"
# Key derivation for LUKS2: argon2id, at most 256 MiB so that small machines
# can still unlock a volume created on a large one.
LUKS2_PBKDF = "argon2id"
LUKS2_MEMORYKB = "262144"

# Machine emulator for security domains: x86_64 only, KVM, no graphics,
# no audio, no network back ends.
QEMU_TARGETS:pn-qemu = "x86_64"
# fdt: the x86_64 system emulator does not configure without it.
PACKAGECONFIG:pn-qemu = "kvm pie fdt"

# Software bill of materials (SPDX) for every image.
INHERIT += "create-spdx"

# Fail the build on these QA issues instead of warning.
ERROR_QA:append = " version-going-backwards"

# ---- graphics: Mesa drivers for hardware acceleration ------------------
# Intel (i915, iris, crocus come by default on x86_64), AMD (r300, r600,
# radeonsi), NVIDIA (nouveau), VMware (svga), virtio (virgl), and the
# software OpenGL fallback llvmpipe (needs LLVM).
PACKAGECONFIG:append:pn-mesa = " gallium-llvm r600 virgl"

# ---- sound and media ----------------------------------------------------
# ALSA directly; no sound server (PulseAudio) in this release.
DISTRO_FEATURES_BACKFILL_CONSIDERED += "pulseaudio"
# GTK video output and VP8/VP9 (WebM) in the media player; Opus audio.
PACKAGECONFIG:append:pn-gstreamer1.0-plugins-good = " gtk vpx"
PACKAGECONFIG:append:pn-gstreamer1.0-plugins-base = " opus"

# ---- Secure Boot ----------------------------------------------------------
# The boot files are signed with tools of the build host (sbsigntool, GnuPG);
# recipes-bsp/cidint-boot uses them only when a boot key is given.
HOSTTOOLS_NONFATAL += "gpg gpg-agent sbsign"
