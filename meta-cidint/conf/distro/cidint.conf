# CIDINT OS distribution policy.
#
# Starts from the Poky reference policy (toolchain defaults, QA checks,
# SPDX generation) and sets CIDINT's own choices on top. The kernel is
# the upstream Linux LTS kernel packaged by the Yocto Project; CIDINT
# does not own it.
require conf/distro/poky.conf

DISTRO = "cidint"
DISTRO_NAME = "CIDINT OS"
DISTRO_VERSION = "0.2.0"
DISTRO_CODENAME = "foundation"
SDK_VENDOR = "-cidintsdk"
MAINTAINER = "CIDINT OS Project"
TARGET_VENDOR = "-cidint"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " usrmerge"
# Not needed on the base image; smaller attack surface.
DISTRO_FEATURES:remove = "nfs zeroconf 3g nfc x11"

# Software bill of materials (SPDX) for every image.
INHERIT += "create-spdx"

# Fail the build on these QA issues instead of warning.
ERROR_QA:append = " version-going-backwards"
