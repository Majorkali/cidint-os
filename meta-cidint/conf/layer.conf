BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "cidint"
BBFILE_PATTERN_cidint = "^${LAYERDIR}/"
BBFILE_PRIORITY_cidint = "10"

LAYERDEPENDS_cidint = "core"
LAYERSERIES_COMPAT_cidint = "scarthgap"

# Root of the CIDINT source repository (this layer lives inside it).
# Recipes for CIDINT-owned components build straight from this tree.
CIDINT_REPO := "${LAYERDIR}/.."
