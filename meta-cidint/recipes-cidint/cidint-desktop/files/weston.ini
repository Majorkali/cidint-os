# CIDINT OS graphical session (Weston desktop shell).
[core]
# Software rendering: works on every display the kernel can drive,
# including virtual machines. Hardware acceleration is not enabled yet.
renderer=pixman
use-pixman=true
idle-time=0
require-input=false

[shell]
background-image=/usr/share/cidint/wallpaper.png
background-type=scale
background-color=0xff0b1f33
panel-color=0xe60a1626
panel-position=top
clock-format=minutes
locking=false

[keyboard]
keymap_layout=us

[launcher]
icon=/usr/share/weston/terminal.png
path=/usr/bin/weston-terminal
