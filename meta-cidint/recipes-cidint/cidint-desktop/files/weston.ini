# CIDINT OS desktop session (Weston desktop shell).
[core]
# Software rendering: works on every display the kernel can drive,
# including virtual machines. Hardware acceleration is not enabled yet.
renderer=pixman
idle-time=0
require-input=false

[shell]
background-image=/usr/share/cidint/wallpaper.png
background-type=scale
background-color=0xff0b1f33
panel-color=0xe60a1626
panel-position=top
clock-format=minutes
locking=false

[keyboard]
keymap_layout=us

[launcher]
icon=/usr/share/cidint/icons/files.png
path=/usr/bin/cidint-files

[launcher]
icon=/usr/share/cidint/icons/terminal.png
path=/usr/bin/weston-terminal

[launcher]
icon=/usr/share/cidint/icons/assistant.png
path=/usr/bin/cidint-assistant

[launcher]
icon=/usr/share/cidint/icons/settings.png
path=/usr/bin/cidint-settings
