# CIDINT OS login screen: a kiosk compositor showing only the greeter.
[core]
renderer=pixman
idle-time=0
require-input=false
shell=kiosk-shell.so

[keyboard]
keymap_layout=us

[autolaunch]
path=/usr/bin/cidint-greeter
# The compositor ends with the greeter; the service then restarts both.
watch=true
