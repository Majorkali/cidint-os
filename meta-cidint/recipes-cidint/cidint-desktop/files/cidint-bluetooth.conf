<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- CIDINT OS: members of the group bluetooth (desktop users) may use
     BlueZ: switch the controller, search, pair and connect. Pairing
     always needs the user's confirmation in Settings or cidint-bluetooth. -->
<busconfig>
  <!-- Everyone else may not (read after BlueZ's own bluetooth.conf, so this
       replaces a more open default there; root keeps BlueZ's own rules). -->
  <policy context="default">
    <deny send_destination="org.bluez"/>
  </policy>
  <policy group="bluetooth">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
