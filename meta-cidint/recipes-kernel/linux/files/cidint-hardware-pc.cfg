# CIDINT OS: drivers for the rest of a typical PC or laptop, as modules
# loaded only when the hardware is present. Options whose dependencies the
# kernel does not meet are dropped by the kernel's configuration step (the
# build log lists them).

# ---- CPU microcode (loaded early by the boot loader), power and sensors
CONFIG_MICROCODE=y
CONFIG_X86_INTEL_PSTATE=y
CONFIG_X86_AMD_PSTATE=y
CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
CONFIG_ACPI_BATTERY=y
CONFIG_ACPI_AC=y
CONFIG_ACPI_BUTTON=y
CONFIG_ACPI_FAN=y
CONFIG_ACPI_THERMAL=y
CONFIG_ACPI_PROCESSOR=y
CONFIG_INTEL_IDLE=y
CONFIG_HWMON=y
CONFIG_SENSORS_CORETEMP=m
CONFIG_SENSORS_K10TEMP=m
CONFIG_SENSORS_NCT6775=m
CONFIG_SENSORS_IT87=m
CONFIG_THERMAL=y
CONFIG_INTEL_POWERCLAMP=m
CONFIG_X86_PKG_TEMP_THERMAL=m
CONFIG_INT340X_THERMAL=m

# ---- laptop platform drivers (hotkeys, backlight, fans, battery limits)
CONFIG_X86_PLATFORM_DEVICES=y
CONFIG_ACPI_WMI=m
CONFIG_WMI_BMOF=m
CONFIG_THINKPAD_ACPI=m
CONFIG_IDEAPAD_LAPTOP=m
CONFIG_DELL_LAPTOP=m
CONFIG_DELL_WMI=m
CONFIG_HP_WMI=m
CONFIG_ASUS_WMI=m
CONFIG_ASUS_NB_WMI=m
CONFIG_ACER_WMI=m
CONFIG_MSI_WMI=m
CONFIG_SURFACE_AGGREGATOR=m
CONFIG_INTEL_HID_EVENT=m
CONFIG_INTEL_VBTN=m
CONFIG_AMD_PMC=m
CONFIG_INTEL_PMC_CORE=m

# ---- keyboards, touchpads, touch screens, pens, game controllers
CONFIG_INPUT_EVDEV=y
CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_USB_HID=y
CONFIG_HID_MULTITOUCH=m
CONFIG_HID_LOGITECH=m
CONFIG_HID_LOGITECH_DJ=m
CONFIG_HID_LOGITECH_HIDPP=m
CONFIG_HID_APPLE=m
CONFIG_HID_MICROSOFT=m
CONFIG_HID_SONY=m
CONFIG_HID_PLAYSTATION=m
CONFIG_HID_NINTENDO=m
CONFIG_HID_WACOM=m
CONFIG_HID_SENSOR_HUB=m
CONFIG_I2C_HID=m
CONFIG_I2C_HID_ACPI=m
CONFIG_INTEL_ISH_HID=m
CONFIG_AMD_SFH_HID=m
CONFIG_MOUSE_PS2=y
CONFIG_MOUSE_PS2_SYNAPTICS=y
CONFIG_MOUSE_PS2_ELANTECH=y
CONFIG_MOUSE_ELAN_I2C=m
CONFIG_MOUSE_SYNAPTICS_I2C=m
CONFIG_KEYBOARD_ATKBD=y
CONFIG_INPUT_JOYSTICK=y
CONFIG_JOYSTICK_XPAD=m
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_TOUCHSCREEN_GOODIX=m
CONFIG_TOUCHSCREEN_ELAN=m
CONFIG_INPUT_MISC=y
CONFIG_INPUT_UINPUT=m
# buses touchpads hang off on Intel and AMD laptops
CONFIG_I2C=y
CONFIG_I2C_DESIGNWARE_PLATFORM=m
CONFIG_I2C_DESIGNWARE_PCI=m
CONFIG_I2C_I801=m
CONFIG_I2C_PIIX4=m
CONFIG_MFD_INTEL_LPSS_PCI=m
CONFIG_MFD_INTEL_LPSS_ACPI=m
CONFIG_PINCTRL_INTEL=y
CONFIG_PINCTRL_SUNRISEPOINT=y
CONFIG_PINCTRL_CANNONLAKE=y
CONFIG_PINCTRL_ICELAKE=y
CONFIG_PINCTRL_TIGERLAKE=y
CONFIG_PINCTRL_ALDERLAKE=y
CONFIG_PINCTRL_METEORLAKE=y
CONFIG_PINCTRL_AMD=y
CONFIG_SPI=y
CONFIG_SPI_PXA2XX=m

# ---- storage: NVMe (also behind Intel VMD/RST), SATA, SD/MMC card readers
CONFIG_BLK_DEV_NVME=y
CONFIG_VMD=m
CONFIG_SATA_AHCI=y
CONFIG_ATA_PIIX=y
CONFIG_MMC=m
CONFIG_MMC_BLOCK=m
CONFIG_MMC_SDHCI=m
CONFIG_MMC_SDHCI_PCI=m
CONFIG_MMC_SDHCI_ACPI=m
CONFIG_MISC_RTSX_PCI=m
CONFIG_MISC_RTSX_USB=m
CONFIG_MMC_REALTEK_PCI=m
CONFIG_MMC_REALTEK_USB=m
CONFIG_USB_STORAGE=m
CONFIG_USB_UAS=m
CONFIG_EXFAT_FS=m
CONFIG_NTFS3_FS=m
CONFIG_VFAT_FS=y
CONFIG_ISO9660_FS=m
CONFIG_UDF_FS=m

# ---- USB, USB-C, Thunderbolt/USB4, docks
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_PCI=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_OHCI_HCD=y
CONFIG_USB_UHCI_HCD=y
CONFIG_TYPEC=m
CONFIG_TYPEC_UCSI=m
CONFIG_UCSI_ACPI=m
CONFIG_USB4=m
CONFIG_USB_ACM=m
CONFIG_USB_SERIAL=m
CONFIG_USB_SERIAL_FTDI_SIO=m
CONFIG_USB_SERIAL_PL2303=m
CONFIG_USB_SERIAL_CP210X=m
CONFIG_USB_SERIAL_CH341=m
CONFIG_USB_PRINTER=m
CONFIG_USB_NET_CDC_NCM=m
CONFIG_USB_NET_RNDIS_HOST=m
CONFIG_USB_IPHETH=m

# ---- cameras (USB video class webcams)
CONFIG_MEDIA_SUPPORT=m
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_VIDEO_DEV=m
CONFIG_USB_VIDEO_CLASS=m

# ---- more sound: SoundWire (newer laptops' audio codecs and amplifiers)
CONFIG_SOUNDWIRE=m
CONFIG_SOUNDWIRE_INTEL=m
CONFIG_SND_SOC_SOF_INTEL_SOUNDWIRE=m
CONFIG_SND_SOC_INTEL_SOUNDWIRE_SOF_MACH=m
CONFIG_SND_SOC_CS35L41_I2C=m
CONFIG_SND_SOC_CS35L41_SPI=m
CONFIG_SND_HDA_SCODEC_CS35L41_I2C=m
CONFIG_SND_HDA_SCODEC_CS35L41_SPI=m
CONFIG_SND_USB_AUDIO=m

# ---- more wired network cards (desktop boards, servers, adapters)
CONFIG_IXGBE=m
CONFIG_I40E=m
CONFIG_ICE=m
CONFIG_AQTION=m
CONFIG_BNXT=m
CONFIG_MLX4_EN=m
CONFIG_MLX5_CORE=m
CONFIG_MLX5_CORE_EN=y
CONFIG_ATL1=m
CONFIG_ATL1E=m
CONFIG_SKY2=m
CONFIG_8139TOO=m
CONFIG_USB_LAN78XX=m
CONFIG_USB_NET_SMSC95XX=m

# ---- graphics: Intel Xe (newer Intel GPUs), AMD display, backlight, NVIDIA open
CONFIG_DRM_XE=m
CONFIG_DRM_AMD_DC_FP=y
CONFIG_DRM_AMDGPU_USERPTR=y
CONFIG_HSA_AMD=y
CONFIG_DRM_NOUVEAU_SVM=y
CONFIG_DRM_SIMPLEDRM=y
CONFIG_DRM_BOCHS=m
CONFIG_DRM_CIRRUS_QEMU=m
CONFIG_DRM_AST=m
CONFIG_DRM_MGAG200=m
CONFIG_DRM_UDL=m
CONFIG_DRM_DISPLAY_CONNECTOR=m

# ---- Bluetooth: mice/keyboards/headsets details
CONFIG_BT_HIDP=m
CONFIG_BT_BNEP=m
CONFIG_BT_LEDS=y
CONFIG_BT_MSFTEXT=y
CONFIG_BT_AOSPEXT=y
