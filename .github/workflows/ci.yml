name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_image:
        description: "Build and boot-test the Yocto image (several hours)"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push replaces a build that is still running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.toolchain }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.75.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy,rustfmt
          rustup default ${{ matrix.toolchain }}
      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - name: Lint
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Crate list matches Cargo.lock
        run: python3 scripts/gen-crates-inc.py --check
      - name: CLI on real Linux
        run: |
          cargo run -q -p cidint --locked -- hardware inventory --json
          cargo run -q -p cidint --locked -- system info

  image:
    name: Yocto image + QEMU persistence test
    # Runs on every push to main (put "[skip image]" in the commit message
    # to skip it) and on manual runs with build_image ticked.
    if: >-
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip image]'))
      || (github.event_name == 'workflow_dispatch' && inputs.build_image)
    needs: rust
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - name: Host packages (apt)
        run: |
          scripts/ci-run.sh "apt-get update" sudo apt-get update
          scripts/ci-run.sh "apt-get install" sudo apt-get install -y --no-install-recommends \
            gawk wget git diffstat unzip texinfo gcc build-essential chrpath socat cpio \
            python3 python3-pip python3-pexpect xz-utils debianutils iputils-ping \
            python3-git python3-jinja2 python3-subunit zstd lz4 file locales \
            libacl1 python3-venv qemu-system-x86 ovmf
      - name: Locale
        run: scripts/ci-run.sh "locale-gen" sudo locale-gen en_US.UTF-8
      - name: Install kas
        run: |
          # The runner's stock pip (22.0) cannot read kas's package metadata;
          # use a virtual environment with a current pip.
          python3 -m venv "$HOME/kas-venv"
          scripts/ci-run.sh "pip upgrade" "$HOME/kas-venv/bin/pip" install --upgrade pip
          scripts/ci-run.sh "pip install kas" "$HOME/kas-venv/bin/pip" install kas==4.8.2
          scripts/ci-run.sh "kas --version" "$HOME/kas-venv/bin/kas" --version
          ls -l /usr/share/OVMF/
      - name: Restore build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          key: yocto-scarthgap-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: yocto-scarthgap-
      - name: Build image
        # Stops before the job limit so the cache below is still saved.
        timeout-minutes: 310
        env:
          LANG: en_US.UTF-8
        run: scripts/ci-run.sh "kas build" "$HOME/kas-venv/bin/kas" build kas/cidint-x86-64-dev.yml
      - name: Save build caches
        # Also after a failed or timed-out build: finished tasks are reused
        # by the next run instead of being compiled again.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          key: yocto-scarthgap-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/image
          deploy=build/tmp/deploy/images/genericx86-64
          ls -l "$deploy"
          # Yocto 5.0 names the link <image>-<machine>.rootfs.wic; older
          # releases omit ".rootfs". Accept either.
          wic=""
          for candidate in "$deploy/cidint-image-base-genericx86-64.rootfs.wic" \
                           "$deploy/cidint-image-base-genericx86-64.wic"; do
            if [ -e "$candidate" ]; then wic="$candidate"; break; fi
          done
          if [ -z "$wic" ]; then
            echo "::error title=Collect artifacts::no .wic image in $deploy: $(ls "$deploy" | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "::notice title=Image file::$(basename "$wic") $(stat -L -c %s "$wic") bytes"
          cp -L "$wic" artifacts/image/cidint-os-0.2.0-dev-x86_64.wic
          cp -L "$wic.bmap" artifacts/image/cidint-os-0.2.0-dev-x86_64.wic.bmap
          cp -L "$deploy"/cidint-image-base-genericx86-64*.spdx.tar.zst artifacts/image/ 2>/dev/null || echo "no SPDX archive found"
          (cd artifacts/image && sha256sum * | tee SHA256SUMS && ls -l)
      - name: Boot and persistence test (QEMU, UEFI)
        run: |
          sudo chmod 666 /dev/kvm || true
          scripts/ci-run.sh "QEMU persistence test" python3 tests/qemu/persistence_boot_test.py \
            artifacts/image/cidint-os-0.2.0-dev-x86_64.wic \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-test-evidence
          path: |
            artifacts/qemu-test/serial.log
            artifacts/qemu-test/persistence-report.json
      - name: Compress image
        run: zstd -T0 --rm artifacts/image/cidint-os-0.2.0-dev-x86_64.wic
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: cidint-os-dev-image
          path: artifacts/image/
