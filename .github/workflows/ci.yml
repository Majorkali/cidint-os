name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_image:
        description: "Build and boot-test the Yocto image (several hours)"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push replaces a build that is still running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.toolchain }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.75.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy,rustfmt
          rustup default ${{ matrix.toolchain }}
      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - name: Lint
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Desktop file operations (unit tests)
        if: matrix.toolchain == 'stable'
        run: python3 -m unittest discover -s tests/desktop -v
      - name: Crate list matches Cargo.lock
        run: python3 scripts/gen-crates-inc.py --check
      - name: CLI on real Linux
        run: |
          cargo run -q -p cidint --locked -- hardware inventory --json
          cargo run -q -p cidint --locked -- system info

  image:
    name: Yocto image + QEMU persistence test
    # Runs on every push to main (put "[skip image]" in the commit message
    # to skip it) and on manual runs with build_image ticked.
    if: >-
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip image]'))
      || (github.event_name == 'workflow_dispatch' && inputs.build_image)
    needs: rust
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      CIDINT_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - name: Host packages (apt)
        run: |
          scripts/ci-run.sh "apt-get update" sudo apt-get update
          scripts/ci-run.sh "apt-get install" sudo apt-get install -y --no-install-recommends \
            gawk wget git diffstat unzip texinfo gcc build-essential chrpath socat cpio \
            python3 python3-pip python3-pexpect xz-utils debianutils iputils-ping \
            python3-git python3-jinja2 python3-subunit zstd lz4 file locales \
            libacl1 python3-venv qemu-system-x86 ovmf \
            sbsigntool gnupg libegl1 libgbm1 libgl1-mesa-dri
      - name: Locale
        run: scripts/ci-run.sh "locale-gen" sudo locale-gen en_US.UTF-8
      - name: Install kas
        run: |
          # The runner's stock pip (22.0) cannot read kas's package metadata;
          # use a virtual environment with a current pip.
          python3 -m venv "$HOME/kas-venv"
          scripts/ci-run.sh "pip upgrade" "$HOME/kas-venv/bin/pip" install --upgrade pip
          scripts/ci-run.sh "pip install kas" "$HOME/kas-venv/bin/pip" install kas==4.8.2
          scripts/ci-run.sh "kas --version" "$HOME/kas-venv/bin/kas" --version
          ls -l /usr/share/OVMF/
      - name: Development signing keys (this run only) and the signed app repository
        # Throwaway Ed25519 keys, one for system updates and one for the
        # software store: their public halves are built into the images, the
        # private halves stay in the runner's temporary directory and are
        # never uploaded. Updates and app catalogues from this run only fit
        # images from this run. Not release keys.
        run: |
          set -euo pipefail
          umask 077
          for k in update-key apps-key; do
            mkdir -p "$RUNNER_TEMP/$k"
            openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/$k/dev.key"
            openssl pkey -in "$RUNNER_TEMP/$k/dev.key" -pubout -out "$RUNNER_TEMP/$k/dev.pub"
          done
          echo "CIDINT_UPDATE_PUBKEY=$(sed -n 2p "$RUNNER_TEMP/update-key/dev.pub")" >> "$GITHUB_ENV"
          echo "CIDINT_APPS_PUBKEY=$(sed -n 2p "$RUNNER_TEMP/apps-key/dev.pub")" >> "$GITHUB_ENV"
          echo "::notice title=Keys::update $(sed -n 2p "$RUNNER_TEMP/update-key/dev.pub") apps $(sed -n 2p "$RUNNER_TEMP/apps-key/dev.pub")"
          umask 022
          python3 scripts/build-app-repo.py --key "$RUNNER_TEMP/apps-key/dev.key" --out artifacts/app-repo
          cp "$RUNNER_TEMP/apps-key/dev.pub" artifacts/app-repo/store-key-DEVELOPMENT.pub
          # Secure Boot: throwaway UEFI and GPG boot keys of this run (the
          # firmware of the Secure Boot test trusts only these).
          scripts/make-keys.sh --dev "$RUNNER_TEMP/keys" > "$RUNNER_TEMP/keys.txt"
          echo "CIDINT_SB_KEY_DIR=$RUNNER_TEMP/keys/boot" >> "$GITHUB_ENV"
          echo "CIDINT_SB_KEY_ID=$(sed -n 's/^  CIDINT_SB_KEY_ID=//p' "$RUNNER_TEMP/keys.txt")" >> "$GITHUB_ENV"
          # Release catalogue (workflow "Publish apps"): trusted and used as
          # the default software source when the maintainer has set it up.
          if [ -n "${{ vars.CIDINT_APPS_RELEASE_PUBKEY }}" ]; then
            echo "CIDINT_APPS_RELEASE_PUBKEY=${{ vars.CIDINT_APPS_RELEASE_PUBKEY }}" >> "$GITHUB_ENV"
            echo "CIDINT_STORE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/apps" >> "$GITHUB_ENV"
          fi
      - name: Restore build caches
        uses: actions/cache/restore@v4
        with:
          path: build/sstate-cache
          key: yocto-sstate-scarthgap-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: yocto-sstate-scarthgap-
      - name: Build image
        # Stops before the job limit so the cache below is still saved.
        timeout-minutes: 335
        env:
          LANG: en_US.UTF-8
        run: scripts/ci-run.sh "kas build" "$HOME/kas-venv/bin/kas" build kas/cidint-x86-64-dev.yml
      - name: Cache size
        if: always()
        run: echo "::notice title=Build cache::$(du -sh build/sstate-cache build/downloads 2>/dev/null | tr '\n' ' ')"
      - name: Save build caches
        # Also after a failed or timed-out build: finished tasks are reused
        # by the next run instead of being compiled again.
        # Only the sstate cache: together with the downloads it exceeded
        # GitHub's 10 GB limit and was evicted.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/sstate-cache
          key: yocto-sstate-scarthgap-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p artifacts/image
          deploy=build/tmp/deploy/images/genericx86-64
          ls -l "$deploy"
          # Yocto 5.0 names the links <image>-<machine>.rootfs.<type>; older
          # releases omit ".rootfs". Take the shortest matching name.
          pick() { ls "$deploy"/$1 2>/dev/null | awk '{ print length, $0 }' | sort -n | head -n 1 | cut -d' ' -f2-; }
          wic="$(pick 'cidint-image-base-genericx86-64*.wic')"
          iso="$(pick 'cidint-image-live-genericx86-64*.iso')"
          srv="$(pick 'cidint-image-server-genericx86-64*.wic')"
          dsk="$(pick 'cidint-image-desktop-genericx86-64*.wic')"
          dsl="$(pick 'cidint-image-desktop-live-genericx86-64*.iso')"
          if [ -z "$wic" ] || [ -z "$iso" ] || [ -z "$srv" ] || [ -z "$dsk" ] || [ -z "$dsl" ]; then
            echo "::error title=Collect artifacts::wic='$wic' iso='$iso' server='$srv' in $deploy: $(ls "$deploy" | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          cp -L "$wic" artifacts/image/cidint-os-${CIDINT_VERSION}-x86_64.wic
          cp -L "$wic.bmap" artifacts/image/cidint-os-${CIDINT_VERSION}-x86_64.wic.bmap
          cp -L "$iso" artifacts/image/cidint-os-${CIDINT_VERSION}-live-x86_64.iso
          cp -L "$srv" artifacts/image/cidint-os-${CIDINT_VERSION}-server-x86_64.wic
          cp -L "$dsk" artifacts/image/cidint-os-${CIDINT_VERSION}-desktop-x86_64.wic
          cp -L "$dsl" artifacts/image/cidint-os-${CIDINT_VERSION}-desktop-live-x86_64.iso
          cp -L "$deploy"/cidint-image-base-genericx86-64*.spdx.tar.zst artifacts/image/ 2>/dev/null || echo "no SPDX archive found"
          cp "$RUNNER_TEMP/update-key/dev.pub" artifacts/image/cidint-os-${CIDINT_VERSION}-update-key-DEVELOPMENT.pub
          ls -l artifacts/image
          echo "::notice title=Image files::$(cd artifacts/image && stat -c '%n %s bytes' * | tr '\n' ';')"
      - name: Boot and persistence test, disk image (QEMU, UEFI)
        run: |
          sudo chmod 666 /dev/kvm || true
          scripts/ci-run.sh "QEMU persistence test" python3 tests/qemu/persistence_boot_test.py \
            artifacts/image/cidint-os-${CIDINT_VERSION}-x86_64.wic \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd \
            --expect-first-start
      - name: Boot and amnesic test, live ISO (QEMU, UEFI)
        # Also after an earlier test failed: every result is wanted.
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          scripts/ci-run.sh "QEMU live ISO test" python3 tests/qemu/live_boot_test.py \
            artifacts/image/cidint-os-${CIDINT_VERSION}-live-x86_64.iso \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: Live ISO as a USB stick (QEMU, UEFI)
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          scripts/ci-run.sh "QEMU live USB test" python3 tests/qemu/live_boot_test.py \
            artifacts/image/cidint-os-${CIDINT_VERSION}-live-x86_64.iso \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd \
            --usb --workdir artifacts/qemu-test/live-usb
      - name: Live ISO under legacy BIOS (QEMU, SeaBIOS, CD-ROM)
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          scripts/ci-run.sh "QEMU live BIOS test" python3 tests/qemu/live_boot_test.py \
            artifacts/image/cidint-os-${CIDINT_VERSION}-live-x86_64.iso \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd \
            --legacy-bios --workdir artifacts/qemu-test/live-bios
      - name: Live ISO as a USB stick under legacy BIOS (QEMU, SeaBIOS)
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          scripts/ci-run.sh "QEMU live BIOS USB test" python3 tests/qemu/live_boot_test.py \
            artifacts/image/cidint-os-${CIDINT_VERSION}-live-x86_64.iso \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd \
            --legacy-bios --usb --workdir artifacts/qemu-test/live-bios-usb
      - name: Install to a blank disk, then persistence test (QEMU, UEFI)
        # Also after an earlier test failed: every result is wanted.
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          scripts/ci-run.sh "QEMU install test" python3 tests/qemu/install_test.py             artifacts/image/cidint-os-${CIDINT_VERSION}-live-x86_64.iso             --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd             --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: Encrypted install, unlock at boot, persistence test (QEMU, UEFI)
        # Also after an earlier test failed: every result is wanted.
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          scripts/ci-run.sh "QEMU encrypted install test" python3 tests/qemu/install_test.py \
            artifacts/image/cidint-os-${CIDINT_VERSION}-live-x86_64.iso \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd \
            --encrypt --workdir artifacts/qemu-test/encrypted
      - name: Firewall test with real traffic (QEMU, UEFI)
        # Also after an earlier test failed: every result is wanted.
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          scripts/ci-run.sh "QEMU firewall test" python3 tests/qemu/firewall_test.py \
            artifacts/image/cidint-os-${CIDINT_VERSION}-x86_64.wic \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: Server edition, SSH over the network (QEMU, UEFI)
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          scripts/ci-run.sh "QEMU server test" python3 tests/qemu/server_test.py \
            artifacts/image/cidint-os-${CIDINT_VERSION}-server-x86_64.wic \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: A/B update, trial start, commit and rollback (QEMU, UEFI)
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          scripts/ci-run.sh "QEMU update test" python3 tests/qemu/update_test.py \
            artifacts/image/cidint-os-${CIDINT_VERSION}-live-x86_64.iso \
            --signing-key "$RUNNER_TEMP/update-key/dev.key" \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: Desktop edition, graphical session and screen contents (QEMU, UEFI)
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          scripts/ci-run.sh "QEMU desktop test" python3 tests/qemu/desktop_test.py \
            artifacts/image/cidint-os-${CIDINT_VERSION}-desktop-x86_64.wic \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: Desktop live ISO, graphical session from the live medium (QEMU, UEFI)
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          scripts/ci-run.sh "QEMU desktop live test" python3 tests/qemu/desktop_test.py \
            artifacts/image/cidint-os-${CIDINT_VERSION}-desktop-live-x86_64.iso \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd \
            --cdrom --workdir artifacts/qemu-test/desktop-live
      - name: Desktop Edition installed from its live ISO, then tested (QEMU, UEFI)
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          scripts/ci-run.sh "QEMU desktop install test" python3 tests/qemu/desktop_install_test.py \
            artifacts/image/cidint-os-${CIDINT_VERSION}-desktop-live-x86_64.iso \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: Desktop apps - sound, media player, browser, software store, OpenGL (QEMU, UEFI)
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          scripts/ci-run.sh "QEMU desktop apps test" python3 tests/qemu/desktop_apps_test.py             artifacts/image/cidint-os-${CIDINT_VERSION}-desktop-x86_64.wic             --app-repo artifacts/app-repo             --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd             --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: Wi-Fi with simulated radios, WPA2 access point, DHCP, saved network (QEMU, UEFI)
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          scripts/ci-run.sh "QEMU Wi-Fi test" python3 tests/qemu/wifi_test.py             artifacts/image/cidint-os-${CIDINT_VERSION}-desktop-x86_64.wic             --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd             --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: Virtual graphics processor, OpenGL through virgl (QEMU, UEFI)
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          # The runner has no graphics card: vgem gives QEMU a render node,
          # the host's Mesa renders what the guest's virgl driver sends.
          sudo modprobe vgem || echo "vgem is not available on this runner"
          sudo chmod 666 /dev/dri/renderD* 2>/dev/null || true
          scripts/ci-run.sh "QEMU GPU test" python3 tests/qemu/gpu_test.py             artifacts/image/cidint-os-${CIDINT_VERSION}-desktop-x86_64.wic             --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd             --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: Secure Boot with enrolled CIDINT keys, tampered kernel refused (QEMU, UEFI)
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          python3 -m pip install --user virt-firmware==26.8.1
          scripts/ci-run.sh "QEMU Secure Boot test" python3 tests/qemu/secureboot_test.py             artifacts/image/cidint-os-${CIDINT_VERSION}-x86_64.wic             --keys "$RUNNER_TEMP/keys/boot"             --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.secboot.fd             --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd             --ovmf-vars-ms /usr/share/OVMF/OVMF_VARS_4M.ms.fd
      - name: AI engine, included model, sandbox, chat and inference (QEMU, UEFI)
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          # Test fixture only: a tiny story model (about 1 MB) standing for a
          # model the user adds. The included model is in the image.
          mkdir -p artifacts/model
          scripts/ci-run.sh "download test model" curl -fsSL --retry 5 -o artifacts/model/stories260K.gguf \
            https://huggingface.co/ggml-org/models-moved/resolve/main/tinyllamas/stories260K.gguf
          ls -l artifacts/model
          scripts/ci-run.sh "QEMU AI test" python3 tests/qemu/ai_test.py \
            artifacts/image/cidint-os-${CIDINT_VERSION}-x86_64.wic \
            --model artifacts/model/stories260K.gguf \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: Security domains, two isolated micro-VMs (QEMU, UEFI)
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          scripts/ci-run.sh "QEMU domain test" python3 tests/qemu/domain_test.py \
            artifacts/image/cidint-os-${CIDINT_VERSION}-x86_64.wic \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: Test summary
        if: always()
        run: |
          for r in $(find artifacts/qemu-test -name '*report.json' 2>/dev/null | sort); do
            echo "::notice title=$r::$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('kvm=%s; ' % d.get('kvm') + '; '.join(('PASS ' if x['passed'] else 'FAIL ') + x['test'] for x in d['results']))" "$r" | cut -c1-3000)"
          done
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-test-evidence
          path: |
            artifacts/qemu-test/**/*serial.log
            artifacts/qemu-test/**/*report.json
            artifacts/qemu-test/**/*.png
      - name: Compress disk image and write checksums
        # Images are published whenever they were built; the test summary
        # of the same run says which suites passed.
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          set -euo pipefail
          zstd -T0 --rm artifacts/image/cidint-os-${CIDINT_VERSION}-x86_64.wic
          zstd -T0 --rm artifacts/image/cidint-os-${CIDINT_VERSION}-server-x86_64.wic
          zstd -T0 --rm artifacts/image/cidint-os-${CIDINT_VERSION}-desktop-x86_64.wic
          cd artifacts/image
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          echo "::notice title=SHA256SUMS::$(tr '\n' ';' < SHA256SUMS)"
      - name: Upload the signed app repository
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: cidint-apps-repo
          path: artifacts/app-repo/
      - name: Upload images
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: cidint-os-images
          path: artifacts/image/
          compression-level: 0
