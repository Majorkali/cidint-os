name: Build CIDINT OS ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      arm64:
        description: "Also build the arm64 image"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v

  iso-amd64:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # Build inside Debian 13 itself: no dependency on the runner's own packages.
    permissions:
      contents: write
    container:
      image: debian:trixie
      options: --privileged -v /:/host
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on the runner
        run: |
          rm -rf /host/usr/share/dotnet /host/usr/local/lib/android /host/opt/ghc                  /host/opt/hostedtoolcache /host/usr/share/swift /host/usr/local/.ghcup
          df -h /
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          CIDINT_ARCH=amd64 CIDINT_OUT="$PWD/out" bash build.sh 2>&1 | tee console.log
      - name: Publish the failure output
        if: failure()
        shell: bash
        run: |
          mkdir -p out
          cp console.log out/console-amd64.log || true
          cp /var/tmp/cidint-build/src/build.log out/build-amd64.log 2>/dev/null || true
          command -v python3 >/dev/null || apt-get install -y python3 >/dev/null 2>&1 || true
          python3 tools/ci-annotate.py console.log 4 40
      # Release assets are limited to 2 GB each, so the ISO is published in parts.
      # Rejoin on Windows:  cmd /c copy /b cidint-os-amd64.iso.part* cidint-os-amd64.iso
      # Rejoin on Linux:    cat cidint-os-amd64.iso.part* > cidint-os-amd64.iso
      - name: Split the ISO for release
        shell: bash
        run: |
          mkdir -p release
          split -b 1900M -d out/cidint-os-amd64.iso release/cidint-os-amd64.iso.part
          cp out/*.sha256 out/*.log out/*.txt release/ 2>/dev/null || true
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CIDINT OS 0.1 (build ${{ github.run_number }})
          body: |
            Untested development build of the CIDINT OS live ISO (amd64).
            The ISO is split into parts; download all `.part*` files and join them:
            Windows: `cmd /c copy /b cidint-os-amd64.iso.part* cidint-os-amd64.iso`
            Linux: `cat cidint-os-amd64.iso.part* > cidint-os-amd64.iso`
            Then verify with the `.sha256` file.
          files: release/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cidint-os-amd64
          path: out/
          compression-level: 0
          if-no-files-found: warn

  iso-arm64:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: sudo CIDINT_ARCH=arm64 CIDINT_OUT="$PWD/out" bash build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cidint-os-arm64
          path: out/
          compression-level: 0
          if-no-files-found: warn
