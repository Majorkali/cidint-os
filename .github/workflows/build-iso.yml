name: Build CIDINT OS ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      arm64:
        description: "Also build the arm64 image"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v

  iso-amd64:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          sudo CIDINT_ARCH=amd64 CIDINT_OUT="$PWD/out" bash build.sh 2>&1 | tee console.log
      - name: Publish the failure output
        if: failure()
        run: |
          mkdir -p out
          cp console.log out/console-amd64.log || true
          sudo sh -c 'cp /var/tmp/cidint-build/builder/build/build.log out/build-amd64.log 2>/dev/null || cp /var/tmp/cidint-build/src/build.log out/build-amd64.log 2>/dev/null || true'
          sudo chmod -R a+r out || true
          python3 tools/ci-annotate.py console.log 4 40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cidint-os-amd64
          path: out/
          compression-level: 0
          if-no-files-found: warn

  iso-arm64:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: sudo CIDINT_ARCH=arm64 CIDINT_OUT="$PWD/out" bash build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cidint-os-arm64
          path: out/
          compression-level: 0
          if-no-files-found: warn
